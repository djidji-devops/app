function b64url(str){return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
function ab2b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');}
function pemToAB(pem){const b64=pem.replace(/-----[^-]+-----/g,'').replace(/\s/g,'');const bin=atob(b64);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf.buffer;}
async function getOAuthToken(){
  const now=Math.floor(Date.now()/1000);
  const h=b64url(JSON.stringify({alg:'RS256',typ:'JWT'}));
  const p=b64url(JSON.stringify({iss:SA_EMAIL,scope:'https://www.googleapis.com/auth/firebase.messaging',aud:'https://oauth2.googleapis.com/token',exp:now+3600,iat:now}));
  const input=`${h}.${p}`;
  const key=await crypto.subtle.importKey('pkcs8',pemToAB(SA_KEY),{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);
  const sig=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',key,new TextEncoder().encode(input));
  const jwt=`${input}.${ab2b64url(sig)}`;
  const res=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:`grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`});
  return (await res.json()).access_token;
}

      await fetch('https://fcm.googleapis.com/v1/projects/proba-9781f/messages:send',{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:{token:t,notification:{title,body},android:{priority:'high',notification:{sound:'default',channel_id:'frigo_nalozi'}}}})});

}
async function initMessaging(radnik){
  if(!('Notification' in window)||!('serviceWorker' in navigator))return;
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted')return;
    const reg=await navigator.serviceWorker.register('/app/firebase-messaging-sw.js');
    const messaging=firebase.messaging();
    messaging.onMessage(payload=>{new Notification(payload.notification?.title||'FRIGO-NIDŽA',{body:payload.notification?.body,icon:'/app/icon-192.png'});});

    }
  }catch(e){console.warn('Messaging init:',e);}
}

function genImeNaloga(){
  const now=new Date(),d=String(now.getDate()).padStart(2,'0'),mo=String(now.getMonth()+1).padStart(2,'0'),y=now.getFullYear();
  const prefix=`RN:${d}-${mo}-${y}-`;
  return prefix+(nalozi.filter(n=>(n.imeNaloga||'').startsWith(prefix)).length+1);
}
