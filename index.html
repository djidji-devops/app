<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FRIGO-NIDZA</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.btn{padding:10px 16px;border-radius:10px;border:none;font-size:15px;font-weight:500;cursor:pointer;width:100%;transition:opacity .15s}
.btn:active{opacity:.7}
.btn-blue{background:#dbeafe;color:#1d4ed8}
.btn-green{background:#dcfce7;color:#15803d}
.btn-red{background:#fee2e2;color:#dc2626;width:auto;padding:4px 10px;font-size:13px}
.btn-gray{background:#f1f5f9;color:#64748b}
input,textarea,select{width:100%;padding:9px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#1e293b;outline:none}
input:focus,textarea:focus,select:focus{border-color:#93c5fd}
textarea{resize:vertical}
.lbl{display:block;font-size:13px;color:#64748b;font-weight:500;margin-bottom:6px;margin-top:14px}
.header{color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.back-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:20px;padding:0;line-height:1}
.badge{font-size:12px;padding:2px 10px;border-radius:20px;display:inline-block;font-weight:500}
.bg{background:#dcfce7;color:#15803d}.by{background:#fef9c3;color:#a16207}
.sec{font-size:11px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.divider{border-top:1px solid #f1f5f9;margin:16px 0}
.wrap{max-width:600px;margin:0 auto;padding:1rem}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{padding:5px 14px;border-radius:20px;border:1px solid #e2e8f0;font-size:13px;cursor:pointer;background:#fff}
.pill.on{background:#f1f5f9;font-weight:500;border-color:#cbd5e1}
.nalog-card{border-radius:0 12px 12px 0}
.sig-wrap{position:relative;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;background:#fff;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:130px}
.sig-ph{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:#94a3b8;pointer-events:none;white-space:nowrap}
.sig-row{display:flex;gap:8px;margin-top:8px}
.sig-saved{border:1px solid #e2e8f0;border-radius:8px;padding:10px;background:#f8fafc}
.img-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.img-thumb{position:relative}
.img-thumb img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #e2e8f0;display:block;cursor:pointer;transition:transform .15s}
.img-thumb img:active{transform:scale(.95)}
.img-rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#fee2e2;border:none;color:#dc2626;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.chk-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;cursor:pointer;border:1px solid #e2e8f0}
.chk-box{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0;border:2px solid #e2e8f0;transition:all .2s}
.loading{display:flex;align-items:center;justify-content:center;height:300px;color:#94a3b8;font-size:15px;flex-direction:column;gap:12px}
.spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.prog-wrap{margin-top:10px;background:#e2e8f0;border-radius:4px;height:5px;overflow:hidden}
.prog-fill{height:100%;background:#3b82f6;width:0%;transition:width .3s;border-radius:4px}
.upload-btn{display:block;text-align:center;padding:10px;border-radius:8px;border:1.5px dashed #cbd5e1;cursor:pointer;font-size:14px;color:#64748b;background:#f8fafc;margin-top:6px}
.upload-btn:active{background:#f1f5f9}
.info-row{display:flex;gap:6px;margin-bottom:4px;font-size:13px}
.info-label{color:#94a3b8;min-width:110px;flex-shrink:0}
.empty{text-align:center;padding:2rem;color:#94a3b8;font-size:14px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;cursor:pointer}
.lightbox img{max-width:100%;max-height:90vh;border-radius:10px;object-fit:contain;cursor:default}
.lightbox-close{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Modal detalji */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:600px;margin:auto;overflow:hidden}
.modal-header{background:#185FA5;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;padding:0}
.modal-body{padding:1rem 1.25rem}
.modal-section{background:#f8fafc;border-radius:10px;padding:12px 14px;margin-bottom:12px;border:1px solid #f1f5f9}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div>Učitavanje...</div></div>
<div class="toast" id="toast"></div>
<div class="lightbox" id="lightbox" style="display:none" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" onclick="event.stopPropagation()">
</div>
<div class="modal-overlay" id="modal-overlay" style="display:none" onclick="closeModal()">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyDOVltUVCGUz3XtZq4sdjtRbMG7sSp9bM8",
  authDomain:"proba-9781f.firebaseapp.com",
  projectId:"proba-9781f",
  storageBucket:"proba-9781f.firebasestorage.app",
  messagingSenderId:"945092131490",
  appId:"1:945092131490:web:8fcbe9a339927fe822f5fb"
});
const db = firebase.firestore();
const RADNICI = ['Luka','Nikola','Dragan'];
let screen='login', role=null;
let nalozi=[], odgovori={};
let aktivni=null, saving=false;
let sefTab='novi', filterS='svi', pretraga='';
let sigMS=false, drM=false;
let forma=ef(), slikeB64=[];

function ef(){ return{musterija:'',pomocniRadnik:'',uredjaj:'',serijskiBroj:'',punoImeUredjaja:'',datumMontaze:'',opis:'',adresa:'',napomena:'',potpis:null,zavrsen:false}; }
function today(){ return new Date().toLocaleDateString('sr-RS'); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }

// Lightbox
function openLightbox(src){ const lb=document.getElementById('lightbox'); document.getElementById('lightbox-img').src=src; lb.style.display='flex'; document.body.style.overflow='hidden'; }
function closeLightbox(){ document.getElementById('lightbox').style.display='none'; document.body.style.overflow=''; }

// Modal detalji
function openModal(nalogId){
  const n=nalozi.find(x=>x.id===nalogId); if(!n)return;
  const rodg=(odgovori[n.dodeljen]||[]).filter(o=>o.nalogId===n.id);
  const mc=document.getElementById('modal-content');
  mc.innerHTML=`
    <div class="modal-header">
      <div>
        <div style="font-weight:600;font-size:16px">${n.id} — ${n.imeNaloga||''}</div>
        <div style="font-size:12px;opacity:.85">${n.dodeljen} · ${n.datumKreiranja||''}</div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section">
        <div class="sec">Podaci naloga</div>
        <div class="info-row"><span class="info-label">Broj:</span><b>${n.id}</b></div>
        <div class="info-row"><span class="info-label">Ime naloga:</span><span>${n.imeNaloga||'—'}</span></div>
        <div class="info-row"><span class="info-label">Datum:</span><span>${n.datumKreiranja||'—'}</span></div>
        <div class="info-row"><span class="info-label">Dodeljen:</span><span>${n.dodeljen}</span></div>
        <div class="info-row"><span class="info-label">Status:</span><span class="badge ${n.status==='zavrsen'?'bg':'by'}">${n.status==='zavrsen'?'Završen':'Aktivan'}</span></div>
        <div class="info-row" style="margin-top:8px"><span class="info-label">Zahtev:</span><span>${n.zahtev}</span></div>
      </div>
      ${rodg.length===0?`<div class="empty" style="padding:1.5rem">Radnik još nije poslao izveštaj</div>`:
        rodg.map((o,i)=>`
        <div class="modal-section">
          <div class="sec">Izveštaj ${rodg.length>1?i+1+'. ':''} — ${o.vreme}</div>
          ${o.musterija?`<div class="info-row"><span class="info-label">Mušterija:</span><span>${o.musterija}</span></div>`:''}
          ${o.pomocniRadnik?`<div class="info-row"><span class="info-label">Pomoćni radnik:</span><span>${o.pomocniRadnik}</span></div>`:''}
          ${o.punoImeUredjaja?`<div class="info-row"><span class="info-label">Puno ime urđ.:</span><span>${o.punoImeUredjaja}</span></div>`:''}
          ${o.uredjaj?`<div class="info-row"><span class="info-label">Uređaj:</span><span>${o.uredjaj}</span></div>`:''}
          ${o.serijskiBroj?`<div class="info-row"><span class="info-label">Serijski broj:</span><span>${o.serijskiBroj}</span></div>`:''}
          ${o.datumMontaze?`<div class="info-row"><span class="info-label">Datum montaže:</span><span>${o.datumMontaze}</span></div>`:''}
          ${o.opis?`<div class="info-row"><span class="info-label">Opis:</span><span>${o.opis}</span></div>`:''}
          ${o.adresa?`<div class="info-row"><span class="info-label">Adresa:</span><span>${o.adresa}</span></div>`:''}
          ${o.napomena?`<div class="info-row"><span class="info-label">Napomena:</span><span>${o.napomena}</span></div>`:''}
          <div class="info-row"><span class="info-label">Završen:</span><span>${o.zavrsen?'✅ Da':'⏳ Ne'}</span></div>
          ${o.slike&&o.slike.length?`
            <div style="margin-top:10px">
              <div class="sec" style="margin-bottom:6px">Slike (${o.slike.length})</div>
              <div class="img-grid">
                ${o.slike.map(u=>`<div class="img-thumb"><img src="${u}" onclick="openLightbox('${u}')"></div>`).join('')}
              </div>
            </div>`:''}
          ${o.potpis?`
            <div style="margin-top:12px">
              <div class="sec" style="margin-bottom:6px">Potpis mušterije</div>
              <img src="${o.potpis}" onclick="openLightbox('${o.potpis}')" style="max-width:220px;height:65px;object-fit:contain;background:#fff;border:1px solid #e2e8f0;border-radius:8px;display:block;cursor:pointer">
            </div>`:''}
        </div>`).join('')}
    </div>`;
  document.getElementById('modal-overlay').style.display='flex';
  document.body.style.overflow='hidden';
}
function closeModal(){ document.getElementById('modal-overlay').style.display='none'; document.body.style.overflow=''; }

async function loadAll(){
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout — proveri internet ili Firebase pravila')),8000));
  try{
    const [ns,os]=await Promise.race([Promise.all([db.collection('nalozi').get(),db.collection('odgovori').get()]),timeout]);
    nalozi=ns.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    odgovori={};
    os.docs.forEach(d=>{ const x=d.data(); if(!odgovori[x.radnik])odgovori[x.radnik]=[]; odgovori[x.radnik].push({id:d.id,...x}); });
  }catch(e){ alert('Greška: '+e.message); screen='login';role=null;render(); throw e; }
}

async function kreirajNalog(){
  const ime=document.getElementById('inp-ime').value.trim();
  const zahtev=document.getElementById('inp-zahtev').value.trim();
  const datumKreiranja=document.getElementById('inp-datum').value;
  const radnik=document.getElementById('inp-radnik').value;
  if(!ime){toast('Upiši ime radnog naloga!');return;}
  if(!zahtev){toast('Upiši zahtev!');return;}
  const id='NAL-'+String(nalozi.length+1).padStart(3,'0');
  await db.collection('nalozi').doc(id).set({ imeNaloga:ime, zahtev, datumKreiranja:datumKreiranja||today(), dodeljen:radnik, status:'aktivan', createdAt:firebase.firestore.FieldValue.serverTimestamp() });
  toast('Nalog kreiran ✓');
  await loadAll(); sefTab='nalozi'; render();
}

async function obrisiNalog(id){
  if(!confirm('Obrisati nalog '+id+'?'))return;
  await db.collection('nalozi').doc(id).delete();
  await loadAll(); render();
}

async function uploadImgBB(b64){
  const fd=new FormData(); fd.append('key','34a15faf3156ebdd960ba873635206dc'); fd.append('image',b64.split(',')[1]);
  const res=await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd});
  const data=await res.json(); if(!data.success)throw new Error('ImgBB upload failed'); return data.data.url;
}

function resizeImg(file){ return new Promise(res=>{ const rd=new FileReader(); rd.onload=ev=>{ const img=new Image(); img.onload=()=>{ const MAX=900; let w=img.width,h=img.height; if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}} const cv=document.createElement('canvas'); cv.width=w;cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',0.60)); }; img.src=ev.target.result; }; rd.readAsDataURL(file); }); }

function initSig(){
  const cv=document.getElementById('cv-m'); if(!cv)return;
  const pos=e=>{ const r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e; return{x:(s.clientX-r.left)*(cv.width/r.width),y:(s.clientY-r.top)*(cv.height/r.height)}; };
  const start=e=>{ e.preventDefault(); const ctx=cv.getContext('2d'),{x,y}=pos(e); ctx.beginPath();ctx.moveTo(x,y);drM=true; document.getElementById('cv-m-ph')&&(document.getElementById('cv-m-ph').style.display='none'); };
  const move=e=>{ e.preventDefault(); if(!drM)return; const ctx=cv.getContext('2d'); ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#1e293b'; const{x,y}=pos(e); ctx.lineTo(x,y);ctx.stroke();cv.dataset.h='1'; };
  const end=e=>{ e.preventDefault();drM=false; };
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
}
function clearSig(){ const cv=document.getElementById('cv-m');if(!cv)return; cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv.dataset.h='';forma.potpis=null;sigMS=false;render(); }
function saveSig(){ const cv=document.getElementById('cv-m'); if(!cv||!cv.dataset.h){toast('Najpre se potpišite!');return;} forma.potpis=cv.toDataURL('image/png');sigMS=true;render(); }

async function submitForma(){
  if(saving)return;
  if(!forma.opis.trim()){toast('Upiši opis urađenog posla!');return;}
  saving=true; render();
  try{
    const ts=Date.now(); const slikeUrls=[];
    const total=slikeB64.length+(forma.potpis?1:0); let done=0;
    const prog=()=>{ done++; const p=document.getElementById('prog');if(p)p.style.width=(done/Math.max(total,1)*100)+'%'; };
    for(let i=0;i<slikeB64.length;i++){ slikeUrls.push(await uploadImgBB(slikeB64[i])); prog(); }
    let pmUrl=null; if(forma.potpis){ pmUrl=await uploadImgBB(forma.potpis); prog(); }
    await db.collection('odgovori').add({ nalogId:aktivni.id, radnik:role, zahtev:aktivni.zahtev, musterija:forma.musterija, pomocniRadnik:forma.pomocniRadnik, uredjaj:forma.uredjaj, serijskiBroj:forma.serijskiBroj, punoImeUredjaja:forma.punoImeUredjaja, datumMontaze:forma.datumMontaze, opis:forma.opis, adresa:forma.adresa, napomena:forma.napomena, slike:slikeUrls, potpis:pmUrl, zavrsen:forma.zavrsen, vreme:new Date().toLocaleString('sr-RS'), createdAt:firebase.firestore.FieldValue.serverTimestamp() });
    if(forma.zavrsen) await db.collection('nalozi').doc(aktivni.id).update({status:'zavrsen'});
    toast('Izveštaj poslat! ✓');
    aktivni=null; forma=ef(); slikeB64=[]; sigMS=false;
    await loadAll(); screen='radnik';
  }catch(e){ toast('Greška: '+e.message); }
  saving=false; render();
}

// ── Parcijalni re-render liste naloga (bez gubitka fokusa na pretrazi) ──
function renderNaloziLista(){
  const container = document.getElementById('nalozi-lista');
  if(!container) return;
  const prik = getFilteredNalozi();
  container.innerHTML = prik.length===0
    ? `<div class="empty">${pretraga?'Nema rezultata za "'+pretraga+'"':'Nema naloga'}</div>`
    : prik.map(n=>{
        const rodg=(odgovori[n.dodeljen]||[]).filter(o=>o.nalogId===n.id);
        return`<div class="card nalog-card" style="border-left:3px solid ${n.status==='zavrsen'?'#22c55e':'#f59e0b'};cursor:pointer" data-modal="${n.id}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-weight:600;font-size:13px;color:#1d4ed8">${n.id}</span>
              <span class="badge ${n.status==='zavrsen'?'bg':'by'}">${n.status==='zavrsen'?'Završen':'Aktivan'}</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-size:12px;color:#64748b">${n.dodeljen}</span>
              <button class="btn btn-red" data-del="${n.id}">✕</button>
            </div>
          </div>
          <div style="font-weight:600;font-size:14px;margin:8px 0 2px">${n.imeNaloga||''}</div>
          <div style="font-size:13px;color:#64748b;margin-bottom:4px">${n.zahtev}</div>
          <div style="font-size:12px;color:#94a3b8">${n.datumKreiranja||''} ${rodg.length?'· '+rodg.length+' izveštaj':'· Čeka izveštaj'}</div>
          <div style="font-size:12px;color:#3b82f6;margin-top:4px;font-weight:500">Tapni za detalje →</div>
        </div>`;
      }).join('');
  // Ponovo veži event listenere samo za listu
  container.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); obrisiNalog(el.dataset.del); }));
  container.querySelectorAll('[data-modal]').forEach(el=>el.addEventListener('click',()=>openModal(el.dataset.modal)));
}

function getFilteredNalozi(){
  return nalozi.filter(n=>{
    const statusOk=filterS==='svi'?true:filterS==='aktivni'?n.status==='aktivan':n.status==='zavrsen';
    if(!statusOk)return false;
    if(!pretraga.trim())return true;
    const q=pretraga.toLowerCase();
    const rodg=(odgovori[n.dodeljen]||[]).filter(o=>o.nalogId===n.id);
    return (n.id||'').toLowerCase().includes(q)||(n.imeNaloga||'').toLowerCase().includes(q)||(n.zahtev||'').toLowerCase().includes(q)||(n.dodeljen||'').toLowerCase().includes(q)||(n.datumKreiranja||'').toLowerCase().includes(q)||rodg.some(o=>(o.opis||'').toLowerCase().includes(q)||(o.adresa||'').toLowerCase().includes(q)||(o.punoImeUredjaja||'').toLowerCase().includes(q)||(o.serijskiBroj||'').toLowerCase().includes(q)||(o.musterija||'').toLowerCase().includes(q));
  });
}

function render(){
  const app=document.getElementById('app');
  if(screen==='login') app.innerHTML=rLogin();
  else if(screen==='sef') app.innerHTML=rSef();
  else if(screen==='radnik'&&aktivni) app.innerHTML=rForma();
  else app.innerHTML=rRadnik();
  bind();
}

function bind(){
  document.querySelectorAll('[data-role]').forEach(el=>el.addEventListener('click',async()=>{
    role=el.dataset.role; screen=role==='sef'?'sef':'radnik';
    document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div>Učitavanje...</div>';
    await loadAll(); render();
  }));
  document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{ sefTab=el.dataset.tab; render(); }));
  document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{ filterS=el.dataset.filter; render(); }));

  // ── FIX: pretraga ne poziva render(), već samo ažurira listu ──
  const srch=document.getElementById('inp-pretraga');
  if(srch){
    srch.addEventListener('input',()=>{
      pretraga=srch.value;
      renderNaloziLista();
    });
  }

  const btnK=document.getElementById('btn-kreiraj'); if(btnK)btnK.addEventListener('click',kreirajNalog);
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',e=>{ e.stopPropagation(); obrisiNalog(el.dataset.del); }));
  document.querySelectorAll('[data-modal]').forEach(el=>el.addEventListener('click',()=>openModal(el.dataset.modal)));
  document.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{ aktivni=nalozi.find(n=>n.id===el.dataset.open); slikeB64=[];forma=ef();sigMS=false;render(); }));
  const bb=document.getElementById('btn-back'); if(bb)bb.addEventListener('click',()=>{ if(aktivni){aktivni=null;forma=ef();slikeB64=[];sigMS=false;}else{screen='login';role=null;} render(); });
  ['musterija','pomocniRadnik','uredjaj','serijskiBroj','punoImeUredjaja','datumMontaze','opis','adresa','napomena'].forEach(k=>{ const el=document.getElementById('f-'+k); if(el)el.addEventListener('input',()=>forma[k]=el.value); });
  const chkRow=document.getElementById('chk-row'); if(chkRow)chkRow.addEventListener('click',()=>{ forma.zavrsen=!forma.zavrsen; const box=document.getElementById('chk-box'); if(box){box.style.background=forma.zavrsen?'#22c55e':'transparent';box.style.borderColor=forma.zavrsen?'#22c55e':'#e2e8f0';box.textContent=forma.zavrsen?'✓':'';} chkRow.style.background=forma.zavrsen?'#dcfce7':'#f8fafc'; });
  const fi=document.getElementById('f-slike'); if(fi)fi.addEventListener('change',async e=>{ for(const f of Array.from(e.target.files)){ slikeB64.push(await resizeImg(f)); } renderSlikePreview(); });
  if(document.getElementById('sig-m-open')) initSig();
  const bc=document.getElementById('btn-clr-m');if(bc)bc.addEventListener('click',clearSig);
  const bs=document.getElementById('btn-sav-m');if(bs)bs.addEventListener('click',saveSig);
  const bp=document.getElementById('btn-pon-m');if(bp)bp.addEventListener('click',()=>{forma.potpis=null;sigMS=false;render();});
  const sub=document.getElementById('btn-submit'); if(sub)sub.addEventListener('click',submitForma);
  // Lightbox za slike u formi
  document.querySelectorAll('.thumb-click').forEach(img=>img.addEventListener('click',()=>openLightbox(img.src)));
}

function renderSlikePreview(){
  const grid=document.getElementById('slike-grid'); if(!grid)return;
  grid.innerHTML=slikeB64.map((b,i)=>`<div class="img-thumb"><img src="${b}" class="thumb-click"><button class="img-rm" data-ri="${i}">✕</button></div>`).join('');
  grid.querySelectorAll('[data-ri]').forEach(el=>el.addEventListener('click',()=>{ slikeB64.splice(+el.dataset.ri,1); renderSlikePreview(); }));
  grid.querySelectorAll('.thumb-click').forEach(img=>img.addEventListener('click',()=>openLightbox(img.src)));
}

function rLogin(){
  return`<div style="max-width:360px;margin:2rem auto;padding:0 1rem">
    <div style="text-align:center;margin-bottom:28px">
      <div style="font-size:42px;font-weight:900;color:#1565C0;letter-spacing:2px;font-family:'Arial Black','Arial Bold',Arial,sans-serif;margin-bottom:16px">FRIGO-NIDŽA</div>
      <h1 style="font-size:22px;font-weight:600;margin:0 0 4px">Radni nalozi</h1>
    </div>
    <div class="card">
      <div class="sec" style="margin-top:0">Šef</div>
      <button class="btn btn-blue" data-role="sef">🔑 Prijavi se kao šef</button>
    </div>
    <div class="card">
      <div class="sec" style="margin-top:0">Radnik</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${RADNICI.map(r=>`<button class="btn btn-green" data-role="${r}">👷 ${r}</button>`).join('')}
      </div>
    </div>
    <div style="text-align:center;margin-top:24px;padding-bottom:8px">
      <span style="font-size:12px;color:#94a3b8">Powered by </span><span style="font-size:12px;color:#64748b;font-weight:600">Djidji Photography</span>
    </div>
  </div>`;
}

function rSef(){
  const ak=nalozi.filter(n=>n.status==='aktivan').length;
  const zv=nalozi.filter(n=>n.status==='zavrsen').length;
  const prik = getFilteredNalozi();

  const noviHtml=`
    <div class="card">
      <div class="sec" style="margin-top:0">Novi radni nalog</div>
      <label class="lbl" style="margin-top:0">Ime radnog naloga</label>
      <input id="inp-ime" placeholder="Npr. Servis klima uređaja...">
      <div class="two-col" style="margin-top:14px">
        <div>
          <label class="lbl" style="margin-top:0">Datum kreiranja</label>
          <input id="inp-datum" type="date" value="${new Date().toISOString().split('T')[0]}">
        </div>
        <div>
          <label class="lbl" style="margin-top:0">Dodeli radniku</label>
          <select id="inp-radnik">${RADNICI.map(r=>`<option>${r}</option>`).join('')}</select>
        </div>
      </div>
      <label class="lbl">Zahtev</label>
      <textarea id="inp-zahtev" rows="4" placeholder="Opiši šta treba da se uradi..."></textarea>
      <button class="btn btn-blue" id="btn-kreiraj" style="margin-top:14px">Kreiraj nalog</button>
    </div>`;

  const naloziHtml=`
    <div class="pills">
      ${['svi','aktivni','zavrseni'].map(f=>`<button class="pill ${filterS===f?'on':''}" data-filter="${f}">${f==='svi'?'Svi':f==='aktivni'?'Aktivni':'Završeni'}</button>`).join('')}
    </div>
    <input id="inp-pretraga" value="${pretraga}" placeholder="🔍 Pretraži po nazivu, radniku, adresi..." style="margin-bottom:12px">
    <div id="nalozi-lista">
      ${prik.length===0?`<div class="empty">${pretraga?'Nema rezultata za "'+pretraga+'"':'Nema naloga'}</div>`:
      prik.map(n=>{
        const rodg=(odgovori[n.dodeljen]||[]).filter(o=>o.nalogId===n.id);
        return`<div class="card nalog-card" style="border-left:3px solid ${n.status==='zavrsen'?'#22c55e':'#f59e0b'};cursor:pointer" data-modal="${n.id}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-weight:600;font-size:13px;color:#1d4ed8">${n.id}</span>
              <span class="badge ${n.status==='zavrsen'?'bg':'by'}">${n.status==='zavrsen'?'Završen':'Aktivan'}</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-size:12px;color:#64748b">${n.dodeljen}</span>
              <button class="btn btn-red" data-del="${n.id}">✕</button>
            </div>
          </div>
          <div style="font-weight:600;font-size:14px;margin:8px 0 2px">${n.imeNaloga||''}</div>
          <div style="font-size:13px;color:#64748b;margin-bottom:4px">${n.zahtev}</div>
          <div style="font-size:12px;color:#94a3b8">${n.datumKreiranja||''} ${rodg.length?'· '+rodg.length+' izveštaj':'· Čeka izveštaj'}</div>
          <div style="font-size:12px;color:#3b82f6;margin-top:4px;font-weight:500">Tapni za detalje →</div>
        </div>`;
      }).join('')}
    </div>`;

  return`<div>
    <div class="header" style="background:#185FA5">
      <button class="back-btn" id="btn-back">←</button>
      <div>
        <div style="font-weight:600;font-size:16px">Šef panel</div>
        <div style="font-size:12px;opacity:.85">${ak} aktivnih · ${zv} završenih</div>
      </div>
    </div>
    <div class="wrap">
      <div class="pills">
        <button class="pill ${sefTab==='novi'?'on':''}" data-tab="novi">+ Novi nalog</button>
        <button class="pill ${sefTab==='nalozi'?'on':''}" data-tab="nalozi">Svi nalozi</button>
      </div>
      ${sefTab==='novi'?noviHtml:naloziHtml}
    </div>
  </div>`;
}

function rRadnik(){
  const moji=nalozi.filter(n=>n.dodeljen===role);
  const akt=moji.filter(n=>n.status==='aktivan');
  const zav=moji.filter(n=>n.status==='zavrsen');
  return`<div>
    <div class="header" style="background:#0F6E56">
      <button class="back-btn" id="btn-back">←</button>
      <div>
        <div style="font-weight:600;font-size:16px">${role}</div>
        <div style="font-size:12px;opacity:.85">${akt.length} aktivnih naloga</div>
      </div>
    </div>
    <div class="wrap">
      ${moji.length===0?`<div class="empty">Nema dodeljenih naloga</div>`:''}
      ${akt.length?`<div class="sec">Aktivni nalozi</div>${akt.map(n=>`
        <div class="card nalog-card" style="border-left:3px solid #f59e0b;cursor:pointer" data-open="${n.id}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600;font-size:13px;color:#1d4ed8">${n.id}</span>
            <span class="badge by">Aktivan</span>
          </div>
          <div style="font-weight:600;font-size:14px;margin:6px 0 2px">${n.imeNaloga||''}</div>
          <p style="margin:0 0 6px;font-size:13px;color:#64748b">${n.zahtev}</p>
          <div style="font-size:12px;color:#15803d;font-weight:500">Tapni da popuniš →</div>
        </div>`).join('')}`:''}
      ${zav.length?`<div class="sec" style="margin-top:8px">Završeni nalozi</div>${zav.map(n=>`
        <div class="card nalog-card" style="border-left:3px solid #22c55e;opacity:.7">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600;font-size:13px;color:#1d4ed8">${n.id}</span>
            <span class="badge bg">Završen</span>
          </div>
          <div style="font-weight:600;font-size:14px;margin:6px 0 2px">${n.imeNaloga||''}</div>
          <p style="margin:0;font-size:13px;color:#64748b">${n.zahtev}</p>
        </div>`).join('')}`:''}
    </div>
  </div>`;
}

function rForma(){
  const sigHtml=sigMS&&forma.potpis
    ?`<div class="sig-saved"><div style="font-size:12px;color:#15803d;font-weight:500;margin-bottom:6px">✓ Potpis snimljen</div><img src="${forma.potpis}" style="max-width:100%;height:65px;object-fit:contain;background:#fff;border-radius:8px;display:block"><button style="margin-top:8px;font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid #e2e8f0;background:none;color:#64748b;cursor:pointer" id="btn-pon-m">Ponovi potpis</button></div>`
    :`<div id="sig-m-open"><div class="sig-wrap"><canvas id="cv-m" width="520" height="140"></canvas><div class="sig-ph" id="cv-m-ph">Potpišite se ovde prstom</div></div><div class="sig-row"><button class="btn btn-gray" id="btn-clr-m" style="flex:1;padding:8px;font-size:13px">Obriši</button><button class="btn btn-green" id="btn-sav-m" style="flex:2;padding:8px;font-size:13px">Sačuvaj potpis</button></div></div>`;

  return`<div>
    <div class="header" style="background:#0F6E56">
      <button class="back-btn" id="btn-back">←</button>
      <div>
        <div style="font-weight:600;font-size:16px">${aktivni.id} — ${aktivni.imeNaloga||''}</div>
        <div style="font-size:12px;opacity:.85">Popuni izveštaj</div>
      </div>
    </div>
    <div class="wrap">
      <div class="card" style="background:#eff6ff;border-color:#bfdbfe">
        <div class="sec" style="color:#1d4ed8;margin-bottom:8px">Radni nalog</div>
        <div class="info-row"><span class="info-label" style="color:#3b82f6">Broj:</span><b>${aktivni.id}</b></div>
        <div class="info-row" style="margin-top:4px"><span class="info-label" style="color:#3b82f6">Ime naloga:</span><span>${aktivni.imeNaloga||''}</span></div>
        <div class="info-row" style="margin-top:4px"><span class="info-label" style="color:#3b82f6">Datum:</span><span>${aktivni.datumKreiranja||''}</span></div>
        <div class="info-row" style="margin-top:4px"><span class="info-label" style="color:#3b82f6">Zahtev:</span><span>${aktivni.zahtev}</span></div>
      </div>
      <div class="card">
        <div class="sec" style="margin-top:0">Radnik popunjava</div>
        <label class="lbl" style="margin-top:0">Ime i prezime mušterije</label>
        <input id="f-musterija" value="${forma.musterija}" placeholder="Ime i prezime...">
        <label class="lbl">Pomoćni radnik</label>
        <input id="f-pomocniRadnik" value="${forma.pomocniRadnik}" placeholder="Ime pomoćnog radnika...">
        <label class="lbl">Puno ime uređaja</label>
        <input id="f-punoImeUredjaja" value="${forma.punoImeUredjaja}" placeholder="Puni naziv uređaja...">
        <div class="two-col" style="margin-top:14px">
          <div><label class="lbl" style="margin-top:0">Uređaj</label><input id="f-uredjaj" value="${forma.uredjaj}" placeholder="Tip uređaja..."></div>
          <div><label class="lbl" style="margin-top:0">Serijski broj</label><input id="f-serijskiBroj" value="${forma.serijskiBroj}" placeholder="S/N..."></div>
        </div>
        <label class="lbl">Datum montaže</label>
        <input id="f-datumMontaze" type="date" value="${forma.datumMontaze}">
        <label class="lbl">Opis urađenog posla *</label>
        <textarea id="f-opis" rows="4" placeholder="Opiši šta si uradio...">${forma.opis}</textarea>
        <label class="lbl">Adresa</label>
        <input id="f-adresa" value="${forma.adresa}" placeholder="Adresa gde je posao obavljen...">
        <label class="lbl">Napomena</label>
        <textarea id="f-napomena" rows="3" placeholder="Opciono...">${forma.napomena}</textarea>
        <div class="divider"></div>
        <label class="lbl" style="margin-top:0">Slike</label>
        <input type="file" accept="image/*" multiple id="f-slike" style="display:none">
        <label for="f-slike" class="upload-btn">📷 Dodaj slike</label>
        <div class="img-grid" id="slike-grid">
          ${slikeB64.map((b,i)=>`<div class="img-thumb"><img src="${b}" class="thumb-click"><button class="img-rm" data-ri="${i}">✕</button></div>`).join('')}
        </div>
        <div class="divider"></div>
        <label class="lbl" style="margin-top:0">Potpis mušterije</label>
        ${sigHtml}
        <div class="divider"></div>
        <div class="chk-row" id="chk-row" style="background:${forma.zavrsen?'#dcfce7':'#f8fafc'}">
          <div class="chk-box" id="chk-box" style="background:${forma.zavrsen?'#22c55e':'transparent'};border-color:${forma.zavrsen?'#22c55e':'#e2e8f0'}">${forma.zavrsen?'✓':''}</div>
          <span style="font-size:14px;font-weight:500;color:${forma.zavrsen?'#15803d':'#1e293b'}">Označi kao završen</span>
        </div>
        ${saving?`<div class="prog-wrap"><div class="prog-fill" id="prog"></div></div><div style="font-size:13px;color:#64748b;text-align:center;margin-top:8px">Slanje...</div>`:''}
        <button class="btn btn-green" id="btn-submit" style="margin-top:14px;${saving?'opacity:.6;pointer-events:none':''}">
          ${saving?'Slanje...':'Pošalji izveštaj'}
        </button>
      </div>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
