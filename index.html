async function loadAll(){
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Timeout')),8000));
  try{
    const [ns,os]=await Promise.race([Promise.all([db.collection('nalozi').get(),db.collection('odgovori').get()]),timeout]);
    nalozi=ns.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    odgovori={};
    os.docs.forEach(d=>{ const x=d.data(); if(!odgovori[x.radnik])odgovori[x.radnik]=[]; odgovori[x.radnik].push({id:d.id,...x}); });
  }catch(e){ alert('Greška: '+e.message); screen='login';role=null;render(); throw e; }
}

async function uploadImgBB(b64){
  const fd=new FormData(); fd.append('key','34a15faf3156ebdd960ba873635206dc'); fd.append('image',b64.split(',')[1]);
  const res=await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:fd});
  const data=await res.json(); if(!data.success)throw new Error('ImgBB upload failed'); return data.data.url;
}
function resizeImg(file){ return new Promise(res=>{ const rd=new FileReader(); rd.onload=ev=>{ const img=new Image(); img.onload=()=>{ const MAX=900; let w=img.width,h=img.height; if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}} const cv=document.createElement('canvas'); cv.width=w;cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); res(cv.toDataURL('image/jpeg',0.60)); }; img.src=ev.target.result; }; rd.readAsDataURL(file); }); }

function initSig(){
  const cv=document.getElementById('cv-m'); if(!cv)return;
  const pos=e=>{ const r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e; return{x:(s.clientX-r.left)*(cv.width/r.width),y:(s.clientY-r.top)*(cv.height/r.height)}; };
  const start=e=>{ e.preventDefault(); const ctx=cv.getContext('2d'),{x,y}=pos(e); ctx.beginPath();ctx.moveTo(x,y);drM=true; const ph=document.getElementById('cv-m-ph');if(ph)ph.style.display='none'; };
  const move=e=>{ e.preventDefault(); if(!drM)return; const ctx=cv.getContext('2d'); ctx.lineWidth=2.5;ctx.lineCap='round';ctx.strokeStyle='#1e293b'; const{x,y}=pos(e); ctx.lineTo(x,y);ctx.stroke();cv.dataset.h='1'; };
  const end=e=>{ e.preventDefault();drM=false; };
  cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);cv.addEventListener('mouseup',end);cv.addEventListener('mouseleave',end);
  cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
}
function clearSig(){ const cv=document.getElementById('cv-m');if(!cv)return; cv.getContext('2d').clearRect(0,0,cv.width,cv.height);cv.dataset.h='';forma.potpis=null;sigMS=false;render(); }
function saveSig(){ const cv=document.getElementById('cv-m'); if(!cv||!cv.dataset.h){toast('Najpre se potpišite!');return;} forma.potpis=cv.toDataURL('image/png');sigMS=true;render(); }

function getFilteredNalozi(){
  return nalozi.filter(n=>{
    const ok=filterS==='svi'?true:filterS==='aktivni'?n.status==='aktivan':n.status==='zavrsen';
    if(!ok)return false;
    if(!pretraga.trim())return true;
    const q=pretraga.toLowerCase();
    const allR=[]; Object.values(odgovori).forEach(arr=>arr.forEach(o=>{ if(o.nalogId===n.id)allR.push(o); }));
    return (n.imeNaloga||'').toLowerCase().includes(q)||(n.zahtev||'').toLowerCase().includes(q)||(n.dodeljen||'').toLowerCase().includes(q)||(n.lokacija||'').toLowerCase().includes(q)||allR.some(o=>(o.opis||'').toLowerCase().includes(q)||(o.adresa||'').toLowerCase().includes(q)||(o.musterija||'').toLowerCase().includes(q)||(o.serijskiBroj||'').toLowerCase().includes(q));
  });
}

      ${prik.length===0?`<div class="empty">${pretraga?'Nema rezultata':'Nema naloga'}</div>`:
      prik.map(n=>{
        let rCnt=0; Object.values(odgovori).forEach(arr=>arr.forEach(o=>{ if(o.nalogId===n.id)rCnt++; }));
        return`<div class="card nalog-card" style="border-left:3px solid ${n.status==='zavrsen'?'#3fb950':'#e3b341'};cursor:pointer" data-modal="${n.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
            <span class="rn-id">${n.imeNaloga||n.id}</span>
            <div style="display:flex;gap:6px;align-items:center;flex-shrink:0">
              <span class="badge ${n.status==='zavrsen'?'bg':'by'}">${n.status==='zavrsen'?'Završen':'Aktivan'}</span>
              <button class="btn-pdf" data-pdf="${n.id}">📄 PDF</button>
              <button class="btn-red" data-del="${n.id}">✕</button>
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px;align-items:center">
            <span class="${n.dodeljen?'assign-tag':'badge bn'}">${n.dodeljen||'Nije dodeljen'}</span>
            ${n.lokacija?`<span class="loc-tag">📍 ${n.lokacija}</span>`:''}
          </div>
          <div style="font-size:13px;color:var(--text2);margin-bottom:4px">${n.zahtev}</div>
          <div style="font-size:12px;color:var(--text3)">${rCnt?rCnt+' izveštaj':'Čeka izveštaj'}</div>
          <div style="font-size:12px;color:#388bfd;margin-top:4px;font-weight:500">Tapni za detalje →</div>
        </div>`;
      }).join('')}
    </div>`;
  return`<div>
    <div class="header" style="background:#1158a8">
      <button class="back-btn" id="btn-back">←</button>
      <div><div style="font-weight:600;font-size:16px">Šef panel</div><div style="font-size:12px;opacity:.8">${ak} aktivnih · ${zv} završenih</div></div>
    </div>
    <div class="wrap">
      <div class="pills">
        <button class="pill ${sefTab==='novi'?'on':''}" data-tab="novi">+ Novi nalog</button>
        <button class="pill ${sefTab==='nalozi'?'on':''}" data-tab="nalozi">Svi nalozi</button>
      </div>
      ${sefTab==='novi'?noviHtml:naloziHtml}
    </div>
  </div>`;
}

function rRadnik(){
  const sviAktivni=nalozi.filter(n=>n.status==='aktivan');
  const mojiZavrseni=nalozi.filter(n=>n.status==='zavrsen'&&(odgovori[role]||[]).some(o=>o.nalogId===n.id));
  return`<div>
    <div class="header" style="background:#0d4a2f">
      <button class="back-btn" id="btn-back">←</button>
      <div><div style="font-weight:600;font-size:16px">${role}</div><div style="font-size:12px;opacity:.8">${sviAktivni.length} aktivnih naloga</div></div>
    </div>
    <div class="wrap">
      ${sviAktivni.length===0?`<div class="empty">Nema aktivnih naloga</div>`:''}
      ${sviAktivni.length?`<div class="sec">Aktivni nalozi — odaberi koji ćeš raditi</div>
        ${sviAktivni.map(n=>`<div class="card nalog-card" style="border-left:3px solid #e3b341;cursor:pointer" data-open="${n.id}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap">
            <span class="rn-id">${n.imeNaloga||n.id}</span>
            <div style="display:flex;gap:6px;align-items:center">
              ${n.dodeljen?`<span class="assign-tag">${n.dodeljen}</span>`:`<span class="badge bn">Slobodan</span>`}
              ${n.lokacija?`<span class="loc-tag">📍 ${n.lokacija}</span>`:''}
            </div>
          </div>
          <p style="margin:8px 0 6px;font-size:13px;color:var(--text2)">${n.zahtev}</p>
          <div style="font-size:12px;color:#3fb950;font-weight:500">Tapni da popuniš izveštaj →</div>
        </div>`).join('')}`:''}
      ${mojiZavrseni.length?`<div class="sec" style="margin-top:8px">Moji završeni nalozi</div>
        ${mojiZavrseni.map(n=>`<div class="card nalog-card" style="border-left:3px solid #3fb950;opacity:.6">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="rn-id">${n.imeNaloga||n.id}</span><span class="badge bg">Završen</span>
          </div>
          <p style="margin:6px 0 0;font-size:13px;color:var(--text2)">${n.zahtev}</p>
        </div>`).join('')}`:''}
    </div>
  </div>`;
}

function rForma(){
  const sigHtml=sigMS&&forma.potpis
    ?`<div class="sig-saved"><div style="font-size:12px;color:#3fb950;font-weight:500;margin-bottom:6px">✓ Potpis snimljen</div><img src="${forma.potpis}" style="max-width:100%;height:65px;object-fit:contain;background:#fff;border-radius:8px;display:block"><button style="margin-top:8px;font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--text2);cursor:pointer" id="btn-pon-m">Ponovi potpis</button></div>`
    :`<div id="sig-m-open"><div class="sig-wrap"><canvas id="cv-m" width="520" height="140"></canvas><div class="sig-ph" id="cv-m-ph">Potpišite se ovde prstom</div></div><div class="sig-row"><button class="btn btn-gray" id="btn-clr-m" style="flex:1;padding:8px;font-size:13px">Obriši</button><button class="btn btn-green" id="btn-sav-m" style="flex:2;padding:8px;font-size:13px">Sačuvaj potpis</button></div></div>`;
  return`<div>
    <div class="header" style="background:#0d4a2f">
      <button class="back-btn" id="btn-back">←</button>
      <div><div style="font-weight:700;font-size:14px;font-family:'Courier New',monospace;letter-spacing:.03em">${aktivni.imeNaloga||aktivni.id}</div><div style="font-size:12px;opacity:.8">Popuni izveštaj · ${role}</div></div>
    </div>
    <div class="wrap">
      <div class="info-card-blue">
        <div class="sec" style="color:#388bfd;margin-bottom:8px">Podaci naloga</div>
        <div class="info-row"><span class="info-label">Broj naloga:</span><span class="rn-id">${aktivni.imeNaloga||aktivni.id}</span></div>
        ${aktivni.dodeljen?`<div class="info-row" style="margin-top:4px"><span class="info-label">Dodeljen:</span><span>${aktivni.dodeljen}</span></div>`:''}
        ${aktivni.lokacija?`<div class="info-row" style="margin-top:4px"><span class="info-label">Lokacija:</span><span>📍 ${aktivni.lokacija}</span></div>`:''}
        <div class="info-row" style="margin-top:4px"><span class="info-label">Zahtev:</span><span>${aktivni.zahtev}</span></div>
      </div>
      <div class="card">
        <div class="sec" style="margin-top:0">Radnik popunjava</div>
        <label class="lbl" style="margin-top:0">📅 Datum overe / predaje</label>
        <input id="f-datumOvere" type="date" value="${forma.datumOvere}" style="border-color:var(--blue);background:#0c1f33">
        <div class="divider"></div>
        <label class="lbl" style="margin-top:0">Ime i prezime mušterije</label>
        <input id="f-musterija" value="${forma.musterija}" placeholder="Ime i prezime...">
        <label class="lbl">Pomoćni radnik</label>
        <input id="f-pomocniRadnik" value="${forma.pomocniRadnik}" placeholder="Ime pomoćnog radnika...">
        <label class="lbl">Puno ime uređaja</label>
        <input id="f-punoImeUredjaja" value="${forma.punoImeUredjaja}" placeholder="Puni naziv uređaja...">
        <div class="two-col" style="margin-top:14px">
          <div><label class="lbl" style="margin-top:0">Uređaj</label><input id="f-uredjaj" value="${forma.uredjaj}" placeholder="Tip uređaja..."></div>
          <div><label class="lbl" style="margin-top:0">Serijski broj</label><input id="f-serijskiBroj" value="${forma.serijskiBroj}" placeholder="S/N..."></div>
        </div>
        <label class="lbl">Opis urađenog posla *</label>
        <textarea id="f-opis" rows="4" placeholder="Opiši šta si uradio...">${forma.opis}</textarea>
        <label class="lbl">Adresa</label>
        <input id="f-adresa" value="${forma.adresa}" placeholder="Adresa gde je posao obavljen...">
        <label class="lbl">Napomena</label>
        <textarea id="f-napomena" rows="3" placeholder="Opciono...">${forma.napomena}</textarea>
        <div class="divider"></div>
        <label class="lbl" style="margin-top:0">Slike</label>
        <input type="file" accept="image/*" multiple id="f-slike" style="display:none">
        <label for="f-slike" class="upload-btn">📷 Dodaj slike</label>
        <div class="img-grid" id="slike-grid">${slikeB64.map((b,i)=>`<div class="img-thumb"><img src="${b}" class="thumb-click"><button class="img-rm" data-ri="${i}">✕</button></div>`).join('')}</div>
        <div class="divider"></div>
        <label class="lbl" style="margin-top:0">Potpis mušterije</label>
        ${sigHtml}
        <div class="divider"></div>
        <div class="chk-row" id="chk-row" style="background:${forma.zavrsen?'var(--green-bg)':'var(--card2)'};border-color:${forma.zavrsen?'#3fb95044':'var(--border2)'}">
          <div class="chk-box" id="chk-box" style="background:${forma.zavrsen?'#3fb950':'transparent'};border-color:${forma.zavrsen?'#3fb950':'var(--border2)'}">${forma.zavrsen?'✓':''}</div>
          <span style="font-size:14px;font-weight:500;color:${forma.zavrsen?'#3fb950':'var(--text)'}"}>Označi kao završen</span>
        </div>
        ${saving?`<div class="prog-wrap"><div class="prog-fill" id="prog"></div></div><div style="font-size:13px;color:var(--text2);text-align:center;margin-top:8px">Slanje...</div>`:''}
        <button class="btn btn-green" id="btn-submit" style="margin-top:14px;${saving?'opacity:.5;pointer-events:none':''}">
          ${saving?'Slanje...':'Pošalji izveštaj'}
        </button>
      </div>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
